# @package _global_
# 29DoF + idle reset distribution. Control experiment isolating the H1 fix
# (5% idle/static reset) from the 5-defense missing_dofs apparatus.
#
# Why: H6 = sonic_release_23dof_h6_idle = (5 defenses + idle reset). To
# attribute "23DoF training degrades BASELINE" to either piece, we need
# (a) pure 29DoF finetune (sonic_release.yaml) and
# (b) 29DoF + idle reset only (this file).
defaults:
  - /exp/manager/universal_token/all_modes/sonic_release

manager_env:
  commands:
    motion:
      static_reset_prob: 0.05
      static_motion_name: "neutral_idle_loop_001"
